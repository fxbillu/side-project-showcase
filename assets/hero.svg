<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">商序：让单据、库存与往来款对得上</title>
  <desc id="desc">深绿单据式横幅，右侧展示真实业务规则：三件单价0.335，累计分摊为0.34、0.33、0.34，合计1.01。</desc>
  <rect width="1200" height="280" rx="16" fill="#103c34"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
    <text x="48" y="47" fill="#a9c8b7" font-size="18" letter-spacing="2">商序 / BUSINESS SYSTEMS CASE</text>
    <text x="45" y="118" fill="#ffffff" font-size="53" font-weight="650">让每笔业务，有据可查。</text>
    <text x="48" y="164" fill="#dce9e0" font-size="23">单据有来源 · 库存有流水 · 往来可核对</text>
    <path d="M48 205H656" stroke="#638575"/>
    <text x="48" y="245" fill="#b7d0c1" font-size="20">单公司 / 多仓库</text>
    <path d="M708 40V240" stroke="#638575"/>
    <text x="752" y="53" fill="#dce9e0" font-size="22">累计分摊算例</text>
    <g fill="#e8f0e9"><rect x="752" y="77" width="112" height="81" rx="5"/><rect x="878" y="77" width="112" height="81" rx="5"/><rect x="1004" y="77" width="148" height="81" rx="5"/></g>
    <g fill="#103c34" font-size="34" font-weight="650"><text x="765" y="130">0.34</text><text x="891" y="130">0.33</text><text x="1025" y="130">0.34</text></g>
    <text x="752" y="200" fill="#ffffff" font-size="29">订单金额 ¥1.01</text>
    <text x="752" y="242" fill="#b7d0c1" font-size="18">3件 × 单价0.335 · 金额取两位小数</text>
  </g>
</svg>
