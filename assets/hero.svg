<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">商序 · 商贸进销存</title><desc id="desc">围绕单据、库存和往来款，设计可追溯、可复核的业务系统。单公司、多仓库。</desc><rect width="1200" height="300" rx="16" fill="#103c34"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="56" y="55" fill="#9fc4b5" font-size="17" letter-spacing="3">BUSINESS SYSTEMS / CASE 01</text><text x="52" y="127" fill="#ffffff" font-size="54" font-weight="650">商序 · 商贸进销存</text><text x="56" y="175" fill="#d7e5de" font-size="22">让单据、库存与往来款，对得上，也查得到。</text><path d="M56 211H1144" stroke="#50766a"/><text x="56" y="258" fill="#d7e5de" font-size="18">单据来源 → 库存流水 → 往来结算 → 独立核对</text><text x="944" y="258" fill="#9fc4b5" font-size="16">单公司 / 多仓库</text></g></svg>